<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My cases — Disputr</title><link rel="stylesheet" href="/app.css"></head><body><header><a class="brand" href="/">Disputr</a><nav><button id="billing">Premium</button><button id="logout" class="secondary">Sign out</button></nav></header><main class="page"><div id="msg"></div><p class="eyebrow">Case management</p><h1 style="font-size:48px">My cases</h1><div class="grid"><section><div class="card"><h2>Start a case</h2><form id="caseForm"><label>Category</label><select name="category" required><option>Finance</option><option>Gambling</option><option>Travel</option><option>Retail</option><option>Home & utilities</option><option>Telecoms</option><option>Other</option></select><label>Company</label><input name="company" required><label>Issue type</label><input name="issueType" required><label>What happened?</label><textarea name="whatHappened"></textarea><label>What outcome do you want?</label><textarea name="desiredOutcome"></textarea><p><button>Create case</button></p></form></div></section><section><div class="card"><h2>Your cases</h2><div id="cases">Loading…</div></div><div class="card"><h2>Upcoming reminders</h2><div id="reminders">Loading…</div></div></section></div></main><script src="/app.js"></script></body></html>
